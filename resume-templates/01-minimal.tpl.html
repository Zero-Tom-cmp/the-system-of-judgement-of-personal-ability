<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>简历</title>
<style>
  /* ========= 模板一 · 极简单栏（用户确认版式） =========
     版式参考 alvinluo-tech/CareerExpert 中文单页简历示例的设计体系：
     单一强调色 + 药丸式分区标题 + 弹性行项目头
     本文件由后端 resume.py 填充真实数据，请勿在此写入示例数据 */

  @page { size: A4; margin: 1.5cm; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #0f766e;
    --accent-pale: #f0fdfa;
    --ink: #0f172a;
    --sub: #475569;
    --divider: #e2e8f0;
  }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 10pt;
    line-height: 1.45;
    color: var(--ink);
    background: #fff;
  }

  .page { padding: 0; }

  /* ========= 头部：姓名 + 联系方式（底边线） ========= */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12pt;
    padding-bottom: 6pt;
    border-bottom: 1.5pt solid var(--accent);
  }
  .header h1 {
    font-size: 20pt;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1.15;
  }
  .header .tagline {
    display: block;
    margin-top: 2pt;
    font-size: 10pt;
    font-weight: 600;
    color: var(--accent);
  }
  .contact {
    text-align: right;
    font-size: 9pt;
    line-height: 1.75;
    color: var(--sub);
    white-space: nowrap;
  }
  .contact .ph { color: #94a3b8; }

  /* ========= 分区标题：药丸式（淡底 + 左侧强调条） ========= */
  h2 {
    margin: 11pt 0 6pt;
    padding: 2.5pt 8pt;
    font-size: 10.8pt;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    background: var(--accent-pale);
    border-left: 3pt solid var(--accent);
    border-radius: 0 3pt 3pt 0;
  }
  .page > section:first-of-type h2 { margin-top: 9pt; }

  /* ========= 经历条目 ========= */
  .entry { margin-bottom: 7pt; break-inside: avoid; }
  .entry:last-child { margin-bottom: 0; }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8pt;
  }
  .entry-title { font-weight: 700; }
  .entry-role { margin-left: 6pt; font-size: 9.4pt; font-weight: 600; color: var(--accent); }
  .entry-date { font-size: 9pt; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .entry-sub { margin-top: 1pt; font-size: 9.4pt; color: var(--sub); }

  ul.bullets { list-style: none; margin-top: 2.5pt; }
  ul.bullets li {
    position: relative;
    padding-left: 12pt;
    margin-top: 2pt;
    text-align: justify;
  }
  ul.bullets li::before {
    content: "";
    position: absolute;
    left: 2pt;
    top: 6.5pt;
    width: 3.5pt;
    height: 3.5pt;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ========= 技能组 ========= */
  .skill-group { display: flex; align-items: baseline; margin-top: 3pt; }
  .skill-label { flex: 0 0 86pt; font-size: 9.6pt; font-weight: 700; color: var(--accent); }
  .skill-content { flex: 1; }

  /* ========= 竞赛（一行一条） ========= */
  .comp {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8pt;
    margin-top: 3.5pt;
  }
  .comp-name { font-weight: 600; }
  .comp-meta { font-size: 9pt; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ========= 占位符与页脚 ========= */
  .empty-hint { color: #94a3b8; font-size: 9.4pt; }
  .footer-note {
    margin-top: 14pt;
    text-align: center;
    font-size: 8pt;
    color: #9aa4b2;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="page">

  <header class="header">
    <div>
      <h1>{{NAME}}</h1>
      <span class="tagline">{{TAGLINE}}</span>
    </div>
    <div class="contact">{{CONTACT_HTML}}</div>
  </header>

  <section>
    <h2>教育背景</h2>
    {{EDUCATION_HTML}}
  </section>

  <section>
    <h2>专业技能</h2>
    {{SKILLS_HTML}}
  </section>

  <section>
    <h2>实习经历</h2>
    {{INTERNSHIPS_HTML}}
  </section>

  <section>
    <h2>项目经历</h2>
    {{PROJECTS_HTML}}
  </section>

  <section>
    <h2>竞赛获奖</h2>
    {{COMPETITIONS_HTML}}
  </section>

  <div class="footer-note">{{FOOTER_NOTE}}</div>

</div>

</body>
</html>
